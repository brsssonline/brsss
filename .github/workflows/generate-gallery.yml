name: Generate gallery.json

on:
  push:
    paths:
      - 'images/gallery/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build gallery.json from folders
        run: node scripts/generate-gallery.js

      - name: Commit gallery.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery.json
          git diff --staged --quiet || git commit -m "Update gallery.json from images/gallery folders"
          git push
